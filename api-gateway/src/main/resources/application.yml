server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        # ── 1. 分级分类预警引擎 (Java :8085) ──
        - id: alarm-warning-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/alert/**
          filters:
            - StripPrefix=1

        # ── 2. 燃气管网安全风控 (Python :8003) ──
        - id: gas-risk-control
          uri: http://localhost:8003
          predicates:
            - Path=/api/gas-risk/**
          filters:
            - StripPrefix=1

        # ── 3. 燃气资产管理 (Python :8001) ──
        - id: gas-asset-manage
          uri: http://localhost:8001
          predicates:
            - Path=/api/gas-asset/**
          filters:
            - StripPrefix=1

        # ── 4. 道路 hazard 管控 (Python :8002) ──
        - id: road-hazard-control
          uri: http://localhost:8002
          predicates:
            - Path=/api/road-hazard/**
          filters:
            - StripPrefix=1

        # ── 5. 综合数据平台 (Python :8000) ──
        - id: data-platform
          uri: http://localhost:8000
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=1

        # ── 6. 前端静态资源 (Vue :5173) ──
        - id: alarm-warning-frontend
          uri: http://localhost:5173
          predicates:
            - Path=/frontend/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
