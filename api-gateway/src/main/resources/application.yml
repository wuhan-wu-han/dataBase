server:
  port: 8080

security:
  jwt-secret: ${RBAC_JWT_SECRET:change-this-rbac-secret-in-production}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        # ── 1. 燃气管网安全风控 (Python :8003) ──
        # 前端请求 /api/gas-risk/api/monitoring/sensors
        # StripPrefix=2 剥掉 /api/gas-risk，转发至 8003:/api/monitoring/sensors
        - id: gas-risk-control
          uri: http://localhost:8003
          predicates:
            - Path=/api/gas-risk/**
          filters:
            - StripPrefix=2

        # ── 2. 燃气资产管理 (Python :8001) ──
        # 前端请求 /api/gas-asset/api/assets
        # StripPrefix=2 剥掉 /api/gas-asset，转发至 8001:/api/assets
        - id: gas-asset-manage
          uri: http://localhost:8001
          predicates:
            - Path=/api/gas-asset/**
          filters:
            - StripPrefix=2

        # ── 3. 道路塌陷管控 (Python :8002) ──
        # 前端请求 /api/road-hazard/api/summary
        # StripPrefix=2 剥掉 /api/road-hazard，转发至 8002:/api/summary
        - id: road-hazard-control
          uri: http://localhost:8002
          predicates:
            - Path=/api/road-hazard/**
          filters:
            - StripPrefix=2

        # ── 4. Python 综合服务平台 (Python :8000) ──
        # 前端请求 /api/platform/governance/overview
        # StripPrefix=2 剥掉 /api/platform，转发至 8000:/governance/overview
        # 覆盖模块：数据治理、危化品、管廊、预案、资产成本、工单
        - id: python-platform
          uri: http://localhost:8000
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=2

        # ── 5. 分级分类预警引擎 (Java :8085) ──
        # 兜底路由：主平台 API 路径已含 /api 前缀（如 /api/alerts）
        # 直接转发，不做 StripPrefix
        - id: alarm-warning-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/**
          # 无 filters：透传原路径

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
