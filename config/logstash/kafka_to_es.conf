# Logstash工业设备数据采集配置
# 从Kafka读取设备传感器数据，清洗格式化后写入Elasticsearch

input {
  kafka {
    bootstrap_servers => "kafka:9093"
    topics => ["device-sensor-topic"]
    group_id => "logstash_sensor_group"
    consumer_threads => 1
    auto_offset_reset => "earliest"
    codec => json
    add_field => { "data_domain" => "device" }
  }

  # 管廊环境传感数据（与设备域隔离的独立消费组）
  kafka {
    bootstrap_servers => "kafka:9093"
    topics => ["tunnel-sensor-topic"]
    group_id => "logstash_tunnel_group"
    consumer_threads => 1
    auto_offset_reset => "earliest"
    codec => json
    add_field => { "data_domain" => "tunnel" }
  }
}

filter {
  # 解析时间戳字段
  date {
    match => [ "event_timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }

  # 提取日期分区字段
  ruby {
    code => '
      ts = event.get("event_timestamp")
      if ts
        # 提取日期 yyyy-MM-dd
        event.set("dt", ts[0..9])
        # 提取小时
        event.set("hour", ts[11..12].to_i)
      end
    '
  }

  # 清理不需要的字段
  mutate {
    remove_field => ["message", "@version", "ts"]
  }
}

output {
  # 管廊域数据写入独立索引
  if [data_domain] == "tunnel" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tunnel-sensor-%{+YYYY.MM.dd}"
      document_id => "%{device_id}-%{event_timestamp}"
    }
  } else {
    # 设备域数据写入原索引
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "device-sensor-%{+YYYY.MM.dd}"
      document_id => "%{device_id}-%{event_timestamp}"
    }
  }

  # 控制台输出调试（生产环境可注释）
  stdout {
    codec => rubydebug
  }
}
