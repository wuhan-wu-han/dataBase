server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: alarm-warning-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-naming-strategy: LOWER_CAMEL_CASE
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: alarm-warning-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

alert:
  kafka:
    topics:
      tunnel-sensor: tunnel-sensor-topic
      tunnel-alarm: tunnel-alarm-topic
      gas-risk-event: gas-risk-event-topic
      alert-event: alert-event-topic
  dedup:
    window-minutes: 10

notification:
  auto-enabled: ${NOTIFICATION_AUTO_ENABLED:false}
  platform-base-url: ${PLATFORM_API_URL:http://platform-api:8000}
  internal-token: ${NOTIFICATION_INTERNAL_TOKEN:change-notification-internal-token}
