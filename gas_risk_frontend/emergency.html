<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应急联动关阀 - 燃气管网安全风控系统</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lib/echarts.min.js"></script>
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="page-header">
      <h1>8. 应急联动关阀</h1>
      <p>泄漏预警触发后，自动定位事故点两侧截断阀，生成级联关阀时序（先关上游截断气源、再关下游防倒流、
        严重事件扩大隔离），执行后隔离泄漏段并评估存气量与影响范围。</p>
    </div>

    <div class="card">
      <h3>触发应急联动</h3>
      <div class="form">
        <label>泄漏点桩号 km <input type="number" id="em-km" value="17.5" step="0.1" min="0" max="50"></label>
        <label>事件级别
          <select id="em-level">
            <option value="severe" selected>severe 严重（级联扩大隔离）</option>
            <option value="warning">warning 一般（仅首道隔离）</option>
          </select>
        </label>
        <label>触发来源
          <select id="em-source">
            <option value="manual">manual 人工触发</option>
            <option value="leak_alarm">leak_alarm 泄漏报警联动</option>
          </select>
        </label>
        <button class="btn danger" id="btn-trigger">生成关阀方案</button>
        <button class="btn green" id="btn-execute" disabled>执行级联关阀</button>
        <button class="btn ghost" id="btn-restore" disabled>恢复供气</button>
      </div>
      <div class="result-box" id="plan-box"></div>
    </div>

    <div class="card">
      <h3>管线阀门拓扑 <small>绿色=开启，红色=关闭，★=泄漏点</small></h3>
      <div id="chart-pipeline" class="chart short"></div>
    </div>

    <div class="card">
      <h3>应急事件记录</h3>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr>
            <th>编号</th><th>时间</th><th>泄漏点 km</th><th>级别</th><th>来源</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="event-body"><tr><td colspan="7" class="muted">暂无事件</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/emergency.js"></script>
</body>
</html>
