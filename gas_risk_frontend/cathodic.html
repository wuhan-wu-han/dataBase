<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阴极保护监测 - 燃气管网安全风控系统</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lib/echarts.min.js"></script>
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="page-header">
      <h1>7. 阴极保护监测</h1>
      <p>管道保护电位、恒电位仪输出电流监测与腐蚀防护效果评估。评价准则（断电电位，CSE 参比）：
        E &gt; -0.85V 保护不足｜-1.2V ≤ E ≤ -0.85V 保护正常｜E &lt; -1.2V 过保护。</p>
    </div>

    <div class="card">
      <div class="form">
        <button class="btn" id="btn-evaluate">综合评估</button>
        <button class="btn ghost" id="btn-sim-normal">生成一轮监测数据</button>
        <label>演示异常桩
          <select id="sim-pile"></select>
        </label>
        <button class="btn danger" id="btn-sim-under">模拟保护不足</button>
        <button class="btn danger" id="btn-sim-over">模拟过保护</button>
        <span class="muted" id="eval-summary"></span>
      </div>
    </div>

    <div class="card">
      <h3>测试桩实时状态与评价</h3>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr>
            <th>测试桩</th><th>桩号 km</th><th>通电电位 V</th><th>断电电位 V</th>
            <th>输出电流 A</th><th>评价</th><th>得分</th><th>结论</th>
          </tr></thead>
          <tbody id="pile-body"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>历史趋势 <small>点击表格行切换测试桩</small></h3>
      <div id="chart-history" class="chart"></div>
    </div>

    <div class="card">
      <h3>手动上报监测数据</h3>
      <div class="form">
        <label>测试桩 <select id="rep-pile"></select></label>
        <label>通电电位 V <input type="number" id="rep-on" value="-1.05" step="0.01"></label>
        <label>断电电位 V <input type="number" id="rep-off" value="-0.95" step="0.01"></label>
        <label>输出电流 A <input type="number" id="rep-current" value="8.5" step="0.1"></label>
        <button class="btn" id="btn-report">上报并评价</button>
        <span class="muted" id="report-result"></span>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/cathodic.js"></script>
</body>
</html>
