<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泄漏扩散仿真 - 燃气管网安全风控系统</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lib/echarts.min.js"></script>
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="page-header">
      <h1>3. 泄漏扩散仿真</h1>
      <p>基于高斯烟羽模型（Briggs 扩散系数），模拟不同风速、气压、大气稳定度下燃气浓度的时空分布，
        并按甲烷爆炸极限（5%~15%VOL）计算爆炸危险范围与建议疏散半径。</p>
    </div>

    <div class="card">
      <h3>仿真参数</h3>
      <div class="form">
        <label>泄漏速率 kg/s <input type="number" id="d-rate" value="2" step="0.5" min="0.1"></label>
        <label>风速 m/s <input type="number" id="d-wind" value="3" step="0.5" min="0.5"></label>
        <label>风向 度 <input type="number" id="d-dir" value="45" step="5"></label>
        <label>气压 kPa <input type="number" id="d-pressure" value="101.325" step="0.5"></label>
        <label>温度 ℃ <input type="number" id="d-temp" value="20" step="1"></label>
        <label>大气稳定度
          <select id="d-stability">
            <option value="A">A 强不稳定</option>
            <option value="B">B 不稳定</option>
            <option value="C">C 弱不稳定</option>
            <option value="D" selected>D 中性</option>
            <option value="E">E 弱稳定</option>
            <option value="F">F 稳定</option>
          </select>
        </label>
        <label>源高度 m <input type="number" id="d-height" value="0.5" step="0.1" min="0"></label>
        <label>仿真距离 m <input type="number" id="d-dist" value="600" step="100" min="100"></label>
        <button class="btn" id="btn-sim">开始仿真</button>
        <button class="btn ghost" id="btn-range">仅计算爆炸危险范围</button>
      </div>
    </div>

    <div class="grid cols-3" id="zone-cards" style="display:none">
      <div class="stat-card"><div class="label">爆炸危险区（5%~15%VOL）最远距离</div><div class="value red" id="z-exp">-</div></div>
      <div class="stat-card"><div class="label">警戒区（≥20%LEL）最远距离</div><div class="value yellow" id="z-warn">-</div></div>
      <div class="stat-card"><div class="label">建议疏散半径</div><div class="value accent" id="z-evac">-</div></div>
    </div>

    <div class="card mt">
      <h3>地面浓度时空分布 <small>横轴为下风向距离，纵轴为横风向距离，单位 %LEL</small></h3>
      <div id="chart-heat" class="chart tall"></div>
    </div>

    <div class="card">
      <h3>下风向轴线浓度剖面 <small>红色虚线为爆炸下限 LEL（100%LEL=5%VOL），黄色为警戒阈值 20%LEL</small></h3>
      <div id="chart-profile" class="chart"></div>
      <div class="result-box" id="advice-box"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/diffusion.js"></script>
</body>
</html>
