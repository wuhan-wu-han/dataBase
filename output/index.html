<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能制造工业设备监控大屏</title>
    <script src="echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #060d1f;
            color: #d4e3f5;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            overflow: hidden;
        }
        /* 大屏容器 */
        .screen-container {
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            grid-template-rows: 60px 90px 260px 300px 180px;
            gap: 10px;
            padding: 10px;
            width: 100vw;
            height: 100vh;
        }
        /* 通用面板样式 */
        .panel {
            background: linear-gradient(135deg, rgba(13, 30, 60, 0.9), rgba(8, 18, 40, 0.95));
            border: 1px solid rgba(64, 159, 255, 0.25);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(64, 159, 255, 0.12) inset;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 14px; height: 14px;
            border-top: 2px solid #00d4ff;
            border-left: 2px solid #00d4ff;
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 14px; height: 14px;
            border-bottom: 2px solid #00d4ff;
            border-right: 2px solid #00d4ff;
        }
        .panel-title {
            height: 32px;
            line-height: 32px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: bold;
            color: #00d4ff;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.18), transparent);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .panel-title .dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #00d4ff;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 6px #00d4ff;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .panel-body {
            flex: 1;
            padding: 8px;
            overflow: hidden;
        }
        /* 顶部标题栏 */
        .header-bar {
            grid-column: 1 / 4;
            grid-row: 1;
            background: linear-gradient(90deg, rgba(0, 50, 100, 0.4), rgba(0, 100, 200, 0.3), rgba(0, 50, 100, 0.4));
            border: 1px solid rgba(0, 212, 255, 0.4);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }
        .header-title {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
            flex: 0 0 auto;
        }
        .header-title .subtitle {
            font-size: 14px;
            color: #8db8e0;
            letter-spacing: 2px;
            margin-left: 12px;
            font-weight: normal;
        }
        .header-info {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            font-size: 14px;
        }
        .header-info .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8db8e0;
        }
        .header-info .info-item .val {
            color: #00d4ff;
            font-weight: bold;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #0066cc, #0099ff);
            color: white;
            border: 1px solid #00d4ff;
            padding: 6px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: linear-gradient(135deg, #0099ff, #00d4ff);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
        }
        .refresh-btn:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* 顶部KPI条 */
        .kpi-bar {
            grid-column: 1 / 4;
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
        }
        .kpi-card {
            background: linear-gradient(135deg, rgba(13, 30, 60, 0.9), rgba(8, 18, 40, 0.95));
            border: 1px solid rgba(64, 159, 255, 0.25);
            border-radius: 6px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
        }
        .kpi-label {
            font-size: 12px;
            color: #8db8e0;
            margin-bottom: 4px;
        }
        .kpi-value {
            font-size: 22px;
            font-weight: bold;
            color: #00d4ff;
            font-family: 'Consolas', monospace;
            text-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
        }
        .kpi-value .unit {
            font-size: 12px;
            color: #8db8e0;
            margin-left: 2px;
        }
        .kpi-value.green { color: #10b981; text-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
        .kpi-value.orange { color: #f59e0b; text-shadow: 0 0 6px rgba(245, 158, 11, 0.5); }
        .kpi-value.red { color: #ef4444; text-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
        /* 左侧 */
        .left-top { grid-column: 1; grid-row: 3; }
        .left-middle { grid-column: 1; grid-row: 4; }
        .left-bottom { grid-column: 1; grid-row: 5; }
        /* 中间 */
        .center-top { grid-column: 2; grid-row: 3; }
        .center-middle { grid-column: 2; grid-row: 4; }
        .center-bottom { grid-column: 2; grid-row: 5; }
        /* 右侧 */
        .right-top { grid-column: 3; grid-row: 3; }
        .right-middle { grid-column: 3; grid-row: 4; }
        .right-bottom { grid-column: 3; grid-row: 5; }
        /* 图表容器 */
        .chart {
            width: 100%;
            height: 100%;
        }
        /* 设备状态列表 */
        .device-list {
            height: 100%;
            overflow-y: auto;
            font-size: 12px;
        }
        .device-list::-webkit-scrollbar { width: 4px; }
        .device-list::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); }
        .device-item {
            display: grid;
            grid-template-columns: 1.2fr 1fr 0.8fr 0.7fr;
            gap: 4px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(64, 159, 255, 0.1);
            align-items: center;
        }
        .device-item:hover { background: rgba(0, 212, 255, 0.08); }
        .device-item .id { color: #00d4ff; font-family: Consolas, monospace; }
        .device-item .type { color: #b4c8d8; font-size: 11px; }
        .device-status-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 11px;
            color: white;
            text-align: center;
        }
        .device-item .health {
            font-family: Consolas, monospace;
            text-align: right;
        }
        /* 告警滚动 */
        .alarm-list {
            height: 100%;
            overflow-y: auto;
            font-size: 12px;
        }
        .alarm-list::-webkit-scrollbar { width: 4px; }
        .alarm-list::-webkit-scrollbar-thumb { background: rgba(239, 68, 68, 0.3); }
        .alarm-item {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 6px;
            align-items: center;
        }
        .alarm-item .sev {
            width: 22px;
            height: 22px;
            border-radius: 2px;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .sev-high { background: #ef4444; }
        .sev-mid { background: #f59e0b; }
        .sev-low { background: #3b82f6; }
        .alarm-item .info { font-size: 12px; }
        .alarm-item .info .desc { color: #ffd; }
        .alarm-item .info .meta { color: #8db8e0; font-size: 11px; }
        .alarm-item .time { color: #8db8e0; font-size: 11px; }
        /* 工作流进度 */
        .workflow-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        .workflow-progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #10b981);
            width: 0%;
            transition: width 0.5s;
            box-shadow: 0 0 8px #00d4ff;
        }
        .workflow-tip {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 30, 60, 0.95);
            border: 1px solid #00d4ff;
            padding: 8px 20px;
            border-radius: 4px;
            color: #00d4ff;
            font-size: 13px;
            display: none;
            z-index: 1001;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
<div class="screen-container">
    <!-- 顶部标题栏 -->
    <div class="header-bar">
        <div class="header-title">
            智能制造工业设备监控大屏
            <span class="subtitle">INDUSTRIAL EQUIPMENT MONITORING PLATFORM</span>
        </div>
        <div class="header-info">
            <div class="info-item">班次：<span class="val" id="shift">--</span></div>
            <div class="info-item">系统时间：<span class="val" id="sysTime">--</span></div>
            <button class="refresh-btn" id="refreshBtn" onclick="runWorkflow()">一键刷新数据</button>
        </div>
    </div>

    <!-- 顶部KPI指标条 -->
    <div class="kpi-bar">
        <div class="kpi-card"><div class="kpi-label">设备总数</div><div class="kpi-value" id="kpiTotal">--<span class="unit">台</span></div></div>
        <div class="kpi-card"><div class="kpi-label">在线设备</div><div class="kpi-value green" id="kpiOnline">--<span class="unit">台</span></div></div>
        <div class="kpi-card"><div class="kpi-label">在线率</div><div class="kpi-value green" id="kpiOnlineRate">--<span class="unit">%</span></div></div>
        <div class="kpi-card"><div class="kpi-label">运行中</div><div class="kpi-value green" id="kpiRunning">--<span class="unit">台</span></div></div>
        <div class="kpi-card"><div class="kpi-label">预警设备</div><div class="kpi-value orange" id="kpiWarning">--<span class="unit">台</span></div></div>
        <div class="kpi-card"><div class="kpi-label">故障设备</div><div class="kpi-value red" id="kpiFault">--<span class="unit">台</span></div></div>
        <div class="kpi-card"><div class="kpi-label">全厂OEE</div><div class="kpi-value" id="kpiOEE">--<span class="unit">%</span></div></div>
        <div class="kpi-card"><div class="kpi-label">当日产量</div><div class="kpi-value" id="kpiOutput">--<span class="unit">件</span></div></div>
    </div>

    <!-- 左侧 -->
    <div class="panel left-top">
        <div class="panel-title"><span><span class="dot"></span>设备状态分布</span><span id="statusTotal"></span></div>
        <div class="panel-body"><div id="statusPie" class="chart"></div></div>
    </div>
    <div class="panel left-middle">
        <div class="panel-title"><span><span class="dot"></span>产线设备状态</span><span id="devCount"></span></div>
        <div class="panel-body">
            <div class="device-list" id="deviceList"></div>
        </div>
    </div>
    <div class="panel left-bottom">
        <div class="panel-title"><span><span class="dot"></span>实时告警信息</span><span id="alarmCount"></span></div>
        <div class="panel-body">
            <div class="alarm-list" id="alarmList"></div>
        </div>
    </div>

    <!-- 中间 -->
    <div class="panel center-top">
        <div class="panel-title"><span><span class="dot"></span>核心参数实时趋势</span><span>近24小时</span></div>
        <div class="panel-body"><div id="paramsTrend" class="chart"></div></div>
    </div>
    <div class="panel center-middle">
        <div class="panel-title"><span><span class="dot"></span>车间设备布局热力图</span><span>按健康度渲染</span></div>
        <div class="panel-body"><div id="workshopHeat" class="chart"></div></div>
    </div>
    <div class="panel center-bottom">
        <div class="panel-title"><span><span class="dot"></span>设备KPI指标对比</span><span>OEE / 稼动率 / 性能</span></div>
        <div class="panel-body"><div id="kpiCompare" class="chart"></div></div>
    </div>

    <!-- 右侧 -->
    <div class="panel right-top">
        <div class="panel-title"><span><span class="dot"></span>车间环境监测</span><span>实时</span></div>
        <div class="panel-body"><div id="envGauge" class="chart"></div></div>
    </div>
    <div class="panel right-middle">
        <div class="panel-title"><span><span class="dot"></span>设备健康度排名</span><span>TOP10</span></div>
        <div class="panel-body"><div id="healthRank" class="chart"></div></div>
    </div>
    <div class="panel right-bottom">
        <div class="panel-title"><span><span class="dot"></span>MTBF / MTTR 分析</span><span>单位：小时</span></div>
        <div class="panel-body"><div id="mtbfChart" class="chart"></div></div>
    </div>
</div>

<!-- 底部图表（嵌入到 kpi-bar 下方逻辑：使用独立底部行） -->
<!-- 工作流进度提示 -->
<div class="workflow-bar"><div class="workflow-progress" id="wfProgress"></div></div>
<div class="workflow-tip" id="wfTip"></div>

<script>
// ==============================================================================
// 全局配置
// ==============================================================================
const API_BASE = '';  // 同源访问，FastAPI默认8000端口
const STATUS_COLORS = {
    0: '#666666', 1: '#22c55e', 2: '#10b981',
    3: '#f59e0b', 4: '#ef4444', 5: '#dc2626', 6: '#3b82f6'
};
const STATUS_NAMES = {
    0: '关机', 1: '待机', 2: '运行', 3: '预警', 4: '故障', 5: '急停', 6: '调试'
};

// ECharts实例集合
const charts = {};

// 初始化所有ECharts实例
function initCharts() {
    ['statusPie', 'paramsTrend', 'workshopHeat', 'kpiCompare',
     'envGauge', 'healthRank', 'mtbfChart'].forEach(id => {
        const dom = document.getElementById(id);
        if (dom) charts[id] = echarts.init(dom);
    });
}

// 自适应窗口大小
window.addEventListener('resize', () => {
    Object.values(charts).forEach(c => c && c.resize());
});

// ==============================================================================
// API请求封装
// ==============================================================================
async function fetchData(url) {
    try {
        const resp = await fetch(API_BASE + url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return await resp.json();
    } catch (e) {
        console.error(`请求 ${url} 失败:`, e);
        return null;
    }
}

// ==============================================================================
// 顶部KPI与标题栏渲染
// ==============================================================================
async function renderOverview() {
    const data = await fetchData('/analysis/overview');
    if (!data) return;

    document.getElementById('kpiTotal').innerHTML = `${data.total_devices ?? '--'}<span class="unit">台</span>`;
    document.getElementById('kpiOnline').innerHTML = `${data.online_devices ?? '--'}<span class="unit">台</span>`;
    document.getElementById('kpiOnlineRate').innerHTML = `${((data.online_rate ?? 0) * 100).toFixed(1)}<span class="unit">%</span>`;
    document.getElementById('kpiRunning').innerHTML = `${data.running_devices ?? '--'}<span class="unit">台</span>`;
    document.getElementById('kpiWarning').innerHTML = `${data.warning_devices ?? '--'}<span class="unit">台</span>`;
    document.getElementById('kpiFault').innerHTML = `${data.fault_devices ?? '--'}<span class="unit">台</span>`;
    document.getElementById('kpiOEE').innerHTML = `${((data.factory_oee ?? 0) * 100).toFixed(1)}<span class="unit">%</span>`;
    document.getElementById('kpiOutput').innerHTML = `${data.total_output ?? '--'}<span class="unit">件</span>`;
    document.getElementById('shift').textContent = data.current_shift || '--';
}

// 系统时间实时更新
function updateSysTime() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('sysTime').textContent =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
setInterval(updateSysTime, 1000);
updateSysTime();

// ==============================================================================
// 左侧：设备状态分布饼图
// ==============================================================================
async function renderStatusPie() {
    const list = await fetchData('/analysis/device_status');
    if (!list || !charts.statusPie) return;

    const stats = {};
    Object.keys(STATUS_NAMES).forEach(k => stats[k] = 0);
    list.forEach(d => { stats[d.status_code] = (stats[d.status_code] || 0) + 1; });

    const pieData = Object.entries(stats)
        .filter(([k, v]) => v > 0)
        .map(([k, v]) => ({
            name: STATUS_NAMES[k],
            value: v,
            itemStyle: { color: STATUS_COLORS[k] }
        }));

    document.getElementById('statusTotal').textContent = `共${list.length}台`;

    charts.statusPie.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c}台 ({d}%)' },
        legend: {
            bottom: 2, left: 'center',
            textStyle: { color: '#8db8e0', fontSize: 11 },
            itemWidth: 10, itemHeight: 10
        },
        series: [{
            type: 'pie',
            radius: ['42%', '72%'],
            center: ['50%', '42%'],
            avoidLabelOverlap: true,
            label: { color: '#d4e3f5', fontSize: 11, formatter: '{b}\n{c}台' },
            labelLine: { lineStyle: { color: '#8db8e0' } },
            itemStyle: { borderColor: '#060d1f', borderWidth: 2 },
            data: pieData
        }]
    });
}

// ==============================================================================
// 左侧：设备状态列表
// ==============================================================================
async function renderDeviceList() {
    const list = await fetchData('/analysis/device_status');
    if (!list) return;

    document.getElementById('devCount').textContent = `${list.length}台设备`;
    const html = list.map(d => {
        const color = STATUS_COLORS[d.status_code] || '#888';
        return `
            <div class="device-item">
                <div>
                    <div class="id">${d.device_id}</div>
                    <div class="type">${d.device_type}</div>
                </div>
                <div class="type">${d.workshop}</div>
                <div><span class="device-status-tag" style="background:${color}">${d.status_name}</span></div>
                <div class="health" style="color:${d.health_score >= 80 ? '#10b981' : d.health_score >= 60 ? '#f59e0b' : '#ef4444'}">${d.health_score}</div>
            </div>
        `;
    }).join('');
    document.getElementById('deviceList').innerHTML = html;
}

// ==============================================================================
// 左侧：实时告警列表
// ==============================================================================
async function renderAlarmList() {
    const list = await fetchData('/analysis/alarms');
    if (!list) return;

    document.getElementById('alarmCount').textContent = `${list.length}条告警`;
    const sevMap = { '高': 'high', '中': 'mid', '低': 'low' };
    const html = list.slice(0, 30).map(a => {
        const sevClass = sevMap[a.severity] || 'low';
        return `
            <div class="alarm-item">
                <div class="sev sev-${sevClass}">${a.severity}</div>
                <div class="info">
                    <div class="desc">[${a.device_id}] ${a.alarm_desc}</div>
                    <div class="meta">${a.device_type} · ${a.workshop} · ${a.status}</div>
                </div>
                <div class="time">${(a.timestamp || '').substring(11, 19)}</div>
            </div>
        `;
    }).join('');
    document.getElementById('alarmList').innerHTML = html;
}

// ==============================================================================
// 中间：核心参数实时趋势
// ==============================================================================
async function renderParamsTrend() {
    const data = await fetchData('/analysis/params_trend');
    if (!data || !charts.paramsTrend) return;

    const hours = data.hours || [];
    charts.paramsTrend.setOption({
        tooltip: { trigger: 'axis' },
        legend: {
            data: ['温度(℃)', '压力(MPa)', '振动(mm/s)', '负载率(%)'],
            textStyle: { color: '#8db8e0', fontSize: 11 },
            top: 0
        },
        grid: { left: 55, right: 40, top: 35, bottom: 30 },
        xAxis: {
            type: 'category',
            data: hours.map(h => String(h).padStart(2, '0') + ':00'),
            axisLine: { lineStyle: { color: '#8db8e0' } },
            axisLabel: { color: '#8db8e0', fontSize: 10 }
        },
        yAxis: [
            { type: 'value', name: '', axisLine: { lineStyle: { color: '#8db8e0' } }, axisLabel: { color: '#8db8e0', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(141,184,224,0.1)' } } },
            { type: 'value', name: '', axisLine: { lineStyle: { color: '#8db8e0' } }, axisLabel: { color: '#8db8e0', fontSize: 10 }, splitLine: { show: false } }
        ],
        series: [
            { name: '温度(℃)', type: 'line', smooth: true, data: data.temperature || [], itemStyle: { color: '#ef4444' }, areaStyle: { color: 'rgba(239,68,68,0.1)' }, lineStyle: { width: 2 } },
            { name: '压力(MPa)', type: 'line', smooth: true, yAxisIndex: 1, data: data.pressure || [], itemStyle: { color: '#f59e0b' }, lineStyle: { width: 2 } },
            { name: '振动(mm/s)', type: 'line', smooth: true, yAxisIndex: 1, data: data.vibration || [], itemStyle: { color: '#3b82f6' }, lineStyle: { width: 2 } },
            { name: '负载率(%)', type: 'line', smooth: true, data: data.load || [], itemStyle: { color: '#10b981' }, lineStyle: { width: 2 } }
        ]
    });
}

// ==============================================================================
// 中间：车间布局热力图
// ==============================================================================
async function renderWorkshopHeat() {
    const list = await fetchData('/analysis/device_status');
    if (!list || !charts.workshopHeat) return;

    // 按车间分组，计算平均健康度
    const workshops = {};
    list.forEach(d => {
        if (!workshops[d.workshop]) {
            workshops[d.workshop] = { total: 0, healthSum: 0, devices: [] };
        }
        workshops[d.workshop].total++;
        workshops[d.workshop].healthSum += d.health_score || 0;
        workshops[d.workshop].devices.push(d);
    });

    // 构造散点图：每个设备一个点，按健康度着色
    const workshopNames = Object.keys(workshops);
    const scatterData = [];
    workshopNames.forEach((ws, yIdx) => {
        workshops[ws].devices.forEach((d, xIdx) => {
            scatterData.push({
                value: [xIdx, yIdx, d.health_score, d.device_id, d.status_name, d.device_type],
                itemStyle: {
                    color: d.health_score >= 80 ? '#10b981' :
                            d.health_score >= 60 ? '#f59e0b' : '#ef4444'
                }
            });
        });
    });

    charts.workshopHeat.setOption({
        tooltip: {
            formatter: p => `${p.value[3]}<br/>车间：${workshopNames[p.value[1]]}<br/>类型：${p.value[5]}<br/>状态：${p.value[4]}<br/>健康度：${p.value[2]}`
        },
        grid: { left: 95, right: 30, top: 20, bottom: 30 },
        xAxis: {
            type: 'value',
            min: -0.8,
            max: 4.8,
            axisLabel: { show: false },
            axisLine: { show: false },
            splitLine: { show: false }
        },
        yAxis: {
            type: 'category',
            data: workshopNames,
            axisLine: { lineStyle: { color: '#8db8e0' } },
            axisLabel: { color: '#8db8e0', fontSize: 12 }
        },
        series: [{
            type: 'scatter',
            symbolSize: data => 32 + (data[2] / 100) * 12,
            data: scatterData,
            label: {
                show: true,
                formatter: p => p.value[3].replace(/-\d+$/, ''),
                color: '#fff',
                fontSize: 11,
                fontWeight: 'bold'
            },
            emphasis: { scale: 1.3, label: { fontSize: 13 } }
        }]
    });
}

// ==============================================================================
// 右侧：环境监测仪表盘
// ==============================================================================
async function renderEnvGauge() {
    const data = await fetchData('/analysis/environment');
    if (!data || !charts.envGauge) return;

    const gauges = [
        { title: '温度', value: data.workshop_temp, unit: '℃', min: 0, max: 50, color: '#ef4444' },
        { title: '湿度', value: data.workshop_humidity, unit: '%RH', min: 0, max: 100, color: '#3b82f6' },
        { title: '气压', value: data.workshop_pressure, unit: 'kPa', min: 80, max: 110, color: '#10b981' },
        { title: 'PM2.5', value: data.pm25, unit: 'μg/m³', min: 0, max: 150, color: '#f59e0b' },
        { title: '噪声', value: data.noise, unit: 'dB', min: 30, max: 100, color: '#a855f7' },
        { title: '电柜', value: data.cabinet_temp, unit: '℃', min: 0, max: 80, color: '#00d4ff' }
    ];

    const dom = document.getElementById('envGauge');
    const width = dom.offsetWidth;
    const height = dom.offsetHeight;
    const gap = 15;
    const colWidth = (width - gap) / 2;
    const rowHeight = (height - gap * 2 - 25 - 20) / 3;
    const radius = Math.min(colWidth, rowHeight) * 0.42;

    charts.envGauge.setOption({
        title: {
            text: '空气质量: ' + (data.air_quality || '--'),
            textStyle: { color: '#10b981', fontSize: 12 },
            left: 'center',
            top: 5
        },
        series: gauges.map((g, idx) => {
            const col = idx % 2;
            const row = Math.floor(idx / 2);
            const extraGap = row > 0 ? row * 10 : 0;
            return {
                type: 'gauge',
                center: [colWidth * col + colWidth / 2, 25 + rowHeight * row + rowHeight / 2 + extraGap],
                radius: radius,
                min: g.min,
                max: g.max,
                startAngle: 180,
                endAngle: 0,
                title: { color: '#8db8e0', fontSize: 12, offsetCenter: [0, '85%'] },
                detail: {
                    valueAnimation: true,
                    formatter: '{value}',
                    color: g.color,
                    fontSize: 16,
                    offsetCenter: [0, '45%']
                },
                axisLine: { lineStyle: { width: 10, color: [[0.5, '#10b981'], [0.8, '#f59e0b'], [1, '#ef4444']] } },
                pointer: { width: 3, length: '55%' },
                axisTick: { show: false },
                splitLine: { show: false },
                axisLabel: { show: false },
                data: [{ value: g.value, name: g.title }]
            };
        })
    });
}

// ==============================================================================
// 工作流：一键刷新
// ==============================================================================
let workflowTimer = null;

async function runWorkflow() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '正在执行...';

    const tip = document.getElementById('wfTip');
    const progress = document.getElementById('wfProgress');
    tip.style.display = 'block';
    tip.textContent = '正在启动工作流...';
    progress.style.width = '5%';

    try {
        const resp = await fetch(API_BASE + '/workflow/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ count: 50000, output_dir: 'data/logs' })
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        // 轮询工作流状态
        workflowTimer = setInterval(checkWorkflowStatus, 1500);
    } catch (e) {
        tip.textContent = '工作流启动失败: ' + e.message;
        tip.style.color = '#ef4444';
        btn.disabled = false;
        btn.textContent = '一键刷新数据';
    }
}

async function checkWorkflowStatus() {
    const status = await fetchData('/workflow/status');
    if (!status) return;

    const progress = document.getElementById('wfProgress');
    const tip = document.getElementById('wfTip');
    progress.style.width = (status.progress || 0) + '%';
    tip.textContent = `[${status.current_step || '--'}] ${status.message || ''} (${status.progress || 0}%)`;

    if (!status.running) {
        clearInterval(workflowTimer);
        workflowTimer = null;

        const btn = document.getElementById('refreshBtn');
        btn.disabled = false;
        btn.textContent = '一键刷新数据';

        if (status.error) {
            tip.style.color = '#ef4444';
            tip.textContent = '执行失败: ' + status.message;
        } else {
            tip.style.color = '#10b981';
            tip.textContent = '✓ ' + status.message;
            // 刷新所有图表数据
            setTimeout(() => {
                loadAllData();
                setTimeout(() => { tip.style.display = 'none'; }, 3000);
            }, 500);
        }
    }
}
