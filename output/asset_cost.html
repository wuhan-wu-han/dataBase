<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产价值与成本管理大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0c0a09 0%,#1c1917 50%,#292524 100%);color:#e7e5e4;min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:20px 0 10px;background:linear-gradient(90deg,rgba(245,158,11,0.1),rgba(217,119,6,0.2),rgba(245,158,11,0.1));border-bottom:2px solid rgba(245,158,11,0.3)}
.header h1{font-size:28px;background:linear-gradient(90deg,#f59e0b,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px}
.header .sub{font-size:13px;color:#a8a29e;margin-top:4px}
.stats-bar{display:flex;justify-content:center;gap:30px;padding:15px 20px;background:rgba(0,0,0,0.3)}
.stat-item{text-align:center}
.stat-item .val{font-size:26px;font-weight:bold;color:#fbbf24}
.stat-item .label{font-size:12px;color:#a8a29e;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;padding:15px 20px}
.panel{background:rgba(28,25,23,0.8);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:15px;backdrop-filter:blur(10px)}
.panel-title{font-size:14px;color:#fbbf24;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(245,158,11,0.2);display:flex;align-items:center;gap:8px}
.panel-title::before{content:'';width:4px;height:14px;background:#f59e0b;border-radius:2px}
.chart-box{width:100%;height:260px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:rgba(245,158,11,0.15);color:#fbbf24;padding:8px 6px;text-align:left;font-weight:500}
td{padding:6px;border-bottom:1px solid rgba(245,158,11,0.1);color:#d6d3d1}
tr:hover td{background:rgba(245,158,11,0.05)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
.tag-ok{background:rgba(34,197,94,0.2);color:#4ade80}
.tag-warn{background:rgba(245,158,11,0.2);color:#fbbf24}
.tag-danger{background:rgba(239,68,68,0.2);color:#f87171}
.lcc-bar{height:8px;background:rgba(245,158,11,0.1);border-radius:4px;overflow:hidden;margin-top:4px}
.lcc-fill{height:100%;border-radius:4px;transition:width 0.6s}
.btn{padding:6px 14px;border:1px solid rgba(245,158,11,0.4);background:rgba(245,158,11,0.1);color:#fbbf24;border-radius:4px;cursor:pointer;font-size:12px;transition:all 0.2s}
.btn:hover{background:rgba(245,158,11,0.25)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media(max-width:1200px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<h1>资产价值与成本管理大屏</h1>
<div class="sub">Asset Value & Cost Management Dashboard</div>
</div>

<div class="stats-bar" id="statsBar">
<div class="stat-item"><div class="val" id="totalAssets">-</div><div class="label">资产总数</div></div>
<div class="stat-item"><div class="val" id="totalOriginal">-</div><div class="label">资产原值（万元）</div></div>
<div class="stat-item"><div class="val" id="totalNet">-</div><div class="label">资产净值（万元）</div></div>
<div class="stat-item"><div class="val" id="totalDepr">-</div><div class="label">累计折旧（万元）</div></div>
<div class="stat-item"><div class="val" id="totalCost">-</div><div class="label">年度运维费用（万元）</div></div>
<div class="stat-item"><div class="val" id="deprPct">-</div><div class="label">综合折旧率</div></div>
</div>

<div class="grid">
<div class="panel">
<div class="panel-title">资产分类价值分布</div>
<div class="chart-box" id="chartCategory"></div>
</div>
<div class="panel">
<div class="panel-title">区域资产分布</div>
<div class="chart-box" id="chartRegion"></div>
</div>
<div class="panel">
<div class="panel-title">运维费用构成</div>
<div class="chart-box" id="chartCostType"></div>
</div>
<div class="panel">
<div class="panel-title">月度费用趋势</div>
<div class="chart-box" id="chartMonthly"></div>
</div>
<div class="panel">
<div class="panel-title">高成本资产 TOP10</div>
<div id="topAssetsTable" style="max-height:260px;overflow-y:auto"></div>
</div>
<div class="panel">
<div class="panel-title">LCC 全生命周期成本对比</div>
<div id="lccPanel"></div>
</div>
<div class="panel" style="grid-column:span 2">
<div class="panel-title">资产台账（分页）</div>
<div id="assetTable" style="max-height:300px;overflow-y:auto"></div>
<div class="actions" id="assetPagination"></div>
</div>
<div class="panel">
<div class="panel-title">快捷操作</div>
<div class="actions" style="flex-direction:column;gap:10px">
<button class="btn" onclick="window.open('/output/asset_cost.html','_blank')">刷新大屏</button>
<button class="btn" onclick="window.open('/docs','_blank')">API 文档</button>
<button class="btn" onclick="exportAssets()">导出资产 Excel</button>
<button class="btn" onclick="exportCosts()">导出费用 Excel</button>
</div>
<div style="margin-top:15px;font-size:12px;color:#78716c">
<p>数据更新：<span id="updateTime">-</span></p>
<p>折旧方法：直线法 / 双倍余额递减 / 年数总和</p>
<p>LCC 分析：净现值(NPV)法</p>
</div>
</div>
</div>

<script>
const API = '/asset-cost';
const amber = '#f59e0b', gold = '#fbbf24', darkAmber = '#d97706';
const colors = ['#f59e0b','#fbbf24','#d97706','#b45309','#92400e','#78350f','#fcd34d'];

function fmt(v){return (v/10000).toFixed(1)}
function fmtW(v){return v.toFixed(1)}

async function loadOverview(){
  const r=await fetch(API+'/overview');const d=await r.json();
  document.getElementById('totalAssets').textContent=d.total_assets;
  document.getElementById('totalOriginal').textContent=fmt(d.total_original_value);
  document.getElementById('totalNet').textContent=fmt(d.total_net_value);
  document.getElementById('totalDepr').textContent=fmt(d.total_accumulated_depr);
  document.getElementById('totalCost').textContent=fmt(d.total_annual_cost);
  document.getElementById('deprPct').textContent=d.overall_depr_pct+'%';
  document.getElementById('updateTime').textContent=d.updated_at;
  renderCategoryChart(d.by_category);
  renderRegionChart(d.by_region);
}

function renderCategoryChart(data){
  const chart=echarts.init(document.getElementById('chartCategory'));
  const items=Object.entries(data).map(([k,v])=>({name:k,value:v.original_value}));
  chart.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
    legend:{bottom:0,textStyle:{color:'#a8a29e',fontSize:11}},
    series:[{type:'pie',radius:['40%','70%'],center:['50%','45%'],
      label:{color:'#e7e5e4',fontSize:11},
      data:items,itemStyle:{borderColor:'#1c1917',borderWidth:2},
      color:colors}]
  });
}

function renderRegionChart(data){
  const chart=echarts.init(document.getElementById('chartRegion'));
  const regions=Object.keys(data);
  const values=regions.map(r=>data[r].original_value/10000);
  chart.setOption({
    tooltip:{trigger:'axis'},
    grid:{left:80,right:20,top:10,bottom:30},
    xAxis:{type:'value',axisLabel:{color:'#a8a29e',formatter:'{value}万'},splitLine:{lineStyle:{color:'rgba(245,158,11,0.1)'}}},
    yAxis:{type:'category',data:regions,axisLabel:{color:'#d6d3d1',fontSize:11}},
    series:[{type:'bar',data:values,barWidth:16,
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:darkAmber},{offset:1,color:gold}]),borderRadius:[0,4,4,0]}}]
  });
}

async function loadCostAnalysis(){
  const r=await fetch(API+'/cost-analysis');const d=await r.json();
  renderCostTypeChart(d.by_type);
  renderMonthlyChart(d.monthly_trend);
  renderTopAssets(d.top_cost_assets);
}

function renderCostTypeChart(data){
  const chart=echarts.init(document.getElementById('chartCostType'));
  const items=Object.entries(data).map(([k,v])=>({name:k,value:v.total}));
  chart.setOption({
    tooltip:{trigger:'item',formatter:p=>p.name+': '+(p.value/10000).toFixed(1)+'万'},
    legend:{bottom:0,textStyle:{color:'#a8a29e',fontSize:11}},
    series:[{type:'funnel',left:20,right:20,top:10,bottom:40,
      label:{color:'#e7e5e4',fontSize:11},
      data:items.sort((a,b)=>b.value-a.value),
      color:['#fbbf24','#f59e0b','#d97706','#b45309','#92400e','#78350f']}]
  });
}

function renderMonthlyChart(data){
  const chart=echarts.init(document.getElementById('chartMonthly'));
  const months=Object.keys(data);
  const values=months.map(m=>data[m]/10000);
  chart.setOption({
    tooltip:{trigger:'axis',formatter:p=>p[0].name+': '+p[0].value.toFixed(1)+'万'},
    grid:{left:50,right:20,top:20,bottom:30},
    xAxis:{type:'category',data:months,axisLabel:{color:'#a8a29e',fontSize:10,rotate:30}},
    yAxis:{type:'value',axisLabel:{color:'#a8a29e',formatter:'{value}万'},splitLine:{lineStyle:{color:'rgba(245,158,11,0.1)'}}},
    series:[{type:'line',data:values,smooth:true,
      lineStyle:{color:gold,width:2},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(251,191,36,0.3)'},{offset:1,color:'rgba(251,191,36,0)'}])},
      itemStyle:{color:gold}}]
  });
}

function renderTopAssets(data){
  const maxCost=Math.max(...data.map(d=>d.total_cost));
  let html='<table><tr><th>资产ID</th><th>累计费用</th><th>占比</th></tr>';
  data.forEach(d=>{
    const pct=(d.total_cost/maxCost*100).toFixed(0);
    html+=`<tr><td>${d.asset_id}</td><td>${(d.total_cost/10000).toFixed(1)}万</td>
    <td><div class="lcc-bar"><div class="lcc-fill" style="width:${pct}%;background:${amber}"></div></div></td></tr>`;
  });
  html+='</table>';
  document.getElementById('topAssetsTable').innerHTML=html;
}

async function loadLCC(){
  const r=await fetch(API+'/lcc');const data=await r.json();
  let html='';
  data.forEach(a=>{
    const maxNpv=Math.max(...a.options.map(o=>o.npv));
    html+=`<div style="margin-bottom:12px"><div style="color:#fbbf24;font-size:13px;margin-bottom:6px">${a.project_name}</div>`;
    a.options.forEach(o=>{
      const pct=(o.npv/maxNpv*100).toFixed(0);
      const isBest=o.material===a.recommended;
      html+=`<div style="margin-bottom:4px;font-size:11px">
        <span style="color:${isBest?'#4ade80':'#d6d3d1'}">${o.material_name}</span>
        <span style="float:right;color:#a8a29e">${(o.npv/10000).toFixed(1)}万</span>
        <div class="lcc-bar"><div class="lcc-fill" style="width:${pct}%;background:${isBest?'#4ade80':amber}"></div></div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('lccPanel').innerHTML=html;
}

let currentPage=1;
async function loadAssets(page=1){
  currentPage=page;
  const r=await fetch(API+`/assets?page=${page}&page_size=10`);const d=await r.json();
  let html='<table><tr><th>资产ID</th><th>名称</th><th>分类</th><th>区域</th><th>原值(万)</th><th>净值(万)</th><th>状态</th></tr>';
  d.items.forEach(a=>{
    const tag=a.status==='在用'?'tag-ok':a.status==='已提足'?'tag-warn':'tag-danger';
    html+=`<tr><td>${a.asset_id}</td><td>${a.name}</td><td>${a.category_name}</td><td>${a.region}</td>
    <td>${(a.original_value/10000).toFixed(1)}</td><td>${(a.net_value/10000).toFixed(1)}</td>
    <td><span class="tag ${tag}">${a.status}</span></td></tr>`;
  });
  html+='</table>';
  document.getElementById('assetTable').innerHTML=html;

  let pag='';
  for(let i=1;i<=d.total_pages;i++){
    pag+=`<button class="btn" style="${i===page?'background:rgba(245,158,11,0.4)':''}" onclick="loadAssets(${i})">${i}</button>`;
  }
  document.getElementById('assetPagination').innerHTML=pag;
}

function exportAssets(){window.open(API+'/assets?page=1&page_size=100','_blank')}
function exportCosts(){window.open(API+'/cost-records?page=1&page_size=100','_blank')}

loadOverview();
loadCostAnalysis();
loadLCC();
loadAssets();
setInterval(()=>{loadOverview();loadCostAnalysis()},60000);
</script>
</body>
</html>
